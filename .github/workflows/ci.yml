name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Unit tests
        run: uv run pytest

      # The ignored chromadb advisories only affect the Chroma HTTP server
      # (/api/v2 endpoints, RBAC auth). This app runs Chroma in-process and
      # never starts a server. No fixed version exists yet.
      - name: Vulnerability scan
        run: >-
          uv run pip-audit
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
