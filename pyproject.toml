[project]
name = "langgraph-rag-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.10.1",
    "chromadb>=1.5.5",
    "instructor>=1.14.5",
    "langchain>=1.4.3",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.1",
    "langchain-litellm>=0.6.3",
    "langchain-text-splitters>=1.1.1",
    "langfuse>=4.16.0",
    "langgraph>=1.1.3",
    "litellm>=1.82.6",
    "pydantic>=2.12.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.3.0",
    "tavily-python>=0.7.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20"
]

[dependency-groups]
dev = [
    "deepeval>=4.2.7",
    "google-genai>=2.25.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.9",
]
